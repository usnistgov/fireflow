[package]
name = "fireflow-core"
version = { workspace = true }
edition = { workspace = true }
description = """
Core library code for fireflow.
"""

[dependencies]
chrono = { workspace = true, features = ["clock"] }
thiserror = { workspace = true }
regex = { workspace = true }
derive_more = { workspace = true, features = ["from", "into", "display", "from_str", "as_ref", "add", "mul", "into_iterator"] }
derive-new = { workspace = true }
itertools = { workspace = true }
num_enum = { workspace = true }
num-traits = { workspace = true }
num-derive = { workspace = true }
bigdecimal = { workspace = true }
ambassador = { workspace = true }
unicase = { workspace = true }
serde = { workspace = true, features = ["derive"], optional = true }
nalgebra = { workspace = true, features = ["std"] }
polars-arrow = { workspace = true }
nonempty = { workspace = true }
phf = { workspace = true, features = ["macros", "unicase"] }
type_families = { path = "../type_families" }
pyo3 = { workspace = true, optional = true }
pyo3-polars = { workspace = true, optional = true }
polars = { workspace = true, optional = true, default-features = false }
numpy = { workspace = true, features = ["nalgebra"], optional = true }
fireflow-core-proc = { path = "../fireflow-core-proc", optional = true }

[build-dependencies]
phf = { version = "0.13.1", default-features = false, features = ["unicase"] }
phf_codegen = "0.13.1"
unicase = { workspace = true }

[features]
serde = ["dep:serde", "nalgebra/serde-serialize", "bigdecimal/serde", "chrono/serde"]
python = ["dep:pyo3", "dep:pyo3-polars", "dep:polars", "dep:numpy", "dep:fireflow-core-proc"]

[lints]
workspace = true