[package]
name = "fireflow-types"
version = { workspace = true }
edition = { workspace = true }
description = """
Simple types and constants used throughout other fireflow crates.
"""

[dependencies]
chrono = { workspace = true }
derive_more = { workspace = true, features = ["from", "into", "display", "from_str", "try_into"] }
thiserror = { workspace = true }
const_format = { workspace = true }
pyo3 = { workspace = true, optional = true, features = ["macros", "hashbrown"] }
unicase = { workspace = true }
bigdecimal = { workspace = true }
ambassador = { workspace = true }
derive-new = { workspace = true }
fireflow-core-proc = { path = "../fireflow-core-proc", optional = true }
serde = { workspace = true, features = ["derive"], optional = true }
proptest = { workspace = true, optional = true }
proptest-derive = { workspace = true, optional = true }
num_enum = { workspace = true }
num-derive = { workspace = true }
num-traits = { workspace = true }
regex = { workspace = true }
itertools = { workspace = true }
hashbrown = { workspace = true }
strum = { workspace = true }
strum_macros = { workspace = true }
bytemuck = { workspace = true, features = [ "must_cast", "derive" ] }

[features]
python = ["dep:pyo3", "dep:fireflow-core-proc"]
serde = ["dep:serde"]
testutil = ["dep:proptest", "dep:proptest-derive"]
dash_args = []
underscore_args = []

[lints]
workspace = true