[package]
name = "fireflow-core"
version = { workspace = true }
edition = { workspace = true }
description = """
Core library code for fireflow.
"""

[dependencies]
derive_more.workspace = true
derive_more.features = [
    "from",
    "into",
    "display",
    "from_str",
    "as_ref",
    "add",
    "mul",
    "into_iterator"
]

chrono = { workspace = true, features = ["clock"] }
thiserror = { workspace = true }
regex = { workspace = true }
derive-new = { workspace = true }
itertools = { workspace = true }
num_enum = { workspace = true }
num-traits = { workspace = true }
num-derive = { workspace = true }
bigdecimal = { workspace = true }
ambassador = { workspace = true }
unicase = { workspace = true }
hashbrown = { workspace = true }
fireflow-types = { path = "../fireflow-types" }
serde = { workspace = true, features = ["derive"], optional = true }
nalgebra = { workspace = true, features = ["std"] }
polars-arrow = { workspace = true }
nonempty-collections = { workspace = true }
type_families = { path = "../type_families" }
pyo3 = { workspace = true, optional = true }
numpy = { workspace = true, features = ["nalgebra"], optional = true }
fireflow-core-proc = { path = "../fireflow-core-proc", optional = true }
itoa = { workspace = true, optional = true }
zmij = { workspace = true, optional = true }

[features]
serde = [
    "dep:serde",
    "dep:itoa",
    "dep:zmij",
    "nalgebra/serde-serialize",
    "bigdecimal/serde",
    "chrono/serde",
    "fireflow-types/serde",
    "nonempty-collections/serde",
    "hashbrown/serde"
]
python = [
    "dep:pyo3",
    "dep:numpy",
    "dep:fireflow-core-proc",
    "fireflow-types/python",
]

[lints]
workspace = true